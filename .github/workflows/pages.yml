name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        shell: bash
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          HTTP_CODE="$(curl -L --silent --show-error --retry 5 --retry-delay 2 --output /dev/null --write-out "%{http_code}" "$PAGE_URL")"
          test "$HTTP_CODE" = "200"

          for attempt in 1 2 3 4 5 6; do
            CSS_OK=0
            APP_OK=0
            MANIFEST_OK=0
            ICON_OK=0
            TOUCH_OK=0
            curl -L --fail --silent --show-error "${PAGE_URL}styles.css" | grep -F "PREMIUM SPORTS GLASS v1" >/dev/null && CSS_OK=1 || true
            curl -L --fail --silent --show-error "${PAGE_URL}app.js" | grep -F "admin-overview glass-admin" >/dev/null && APP_OK=1 || true
            curl -L --fail --silent --show-error "${PAGE_URL}manifest.webmanifest" | grep -F "field-icon.svg" >/dev/null && MANIFEST_OK=1 || true
            curl -L --fail --silent --show-error --output /dev/null "${PAGE_URL}icons/field-icon.svg" && ICON_OK=1 || true
            curl -L --fail --silent --show-error --output /dev/null "${PAGE_URL}apple-touch-icon.png" && TOUCH_OK=1 || true
            if [ "$CSS_OK" = "1" ] && [ "$APP_OK" = "1" ] && [ "$MANIFEST_OK" = "1" ] && [ "$ICON_OK" = "1" ] && [ "$TOUCH_OK" = "1" ]; then
              exit 0
            fi
            sleep 3
          done

          echo "Published files did not match the current deployment."
          exit 1
